[package]
name = "pretty-markdown"
version = "0.1.0"
description = "A beautiful markdown reader and editor for documents with LaTeX math"
authors = ["Paulo Akira"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pretty_markdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# iPadOS document access (security-scoped bookmarks, iCloud downloads). iOS-only: the
# desktop build never compiles it.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-ipad-files = { path = "../ipad/tauri-plugin-ipad-files" }

# File watching (reload documents changed on disk) is desktop-only: iOS/iPadOS has no API
# for watching arbitrary files.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
notify = "6"
