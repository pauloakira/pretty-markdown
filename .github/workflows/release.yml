# Builds the macOS app (docs/CI.md).
# - A pull request into main (a release PR) builds it and keeps it as a workflow artifact,
#   so a release is known to bundle before it merges.
# - A version tag (v0.2.0) on main builds it and attaches it to a draft GitHub Release,
#   which stays private until it's published by hand.
name: Release

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: Bundle the macOS app
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the draft release on a tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in tauri.conf.json ($app)"
            exit 1
          fi

      # Unsigned: there is no Developer ID certificate. The release notes say how to open it.
      - name: Build the app and the disk image
        run: npx tauri build --bundles app,dmg

      - name: Keep the disk image as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: pretty-markdown-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Draft a release with the disk image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" src-tauri/target/release/bundle/dmg/*.dmg \
            --draft --verify-tag --title "pretty-markdown $GITHUB_REF_NAME" \
            --notes "Built from $GITHUB_SHA. The app isn't signed by an identified developer: after copying it to Applications, Control-click it and choose Open the first time, or run \`xattr -dr com.apple.quarantine /Applications/pretty-markdown.app\`."
